# Pod runtime: builds the image appstore.yaml refers to, by digest, with the central pipeline of
# DHBW-AppStore-T3/app-registry (validate appstore.yaml, hadolint, build, smoke test, Trivy, push).
# After a build on main, copy the digest from the job summary into appstore.yaml and tag a new version:
# the AppStore only deploys images pinned by digest.
# Pushes happen only when image/ changes. The weekly run builds and scans without pushing, so new vulnerabilities
# in the base image show up although the code did not change.
name: ci
on:
  push:
    branches: [main]
    paths: ["image/**", ".github/workflows/ci.yml", ".github/smoke-test.sh", ".trivyignore", ".hadolint.yaml"]
  pull_request:
    branches: [main]
    paths: ["image/**", "appstore.yaml", ".github/workflows/ci.yml", ".github/smoke-test.sh", ".trivyignore", ".hadolint.yaml"]
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
permissions: { contents: read, packages: write }
jobs:
  app:
    # @v1 is a release tag of app-registry; the pipeline fetches its validator from the same commit.
    uses: DHBW-AppStore-T3/app-registry/.github/workflows/app-ci.yml@v1
    with:
      push: ${{ github.event_name != 'schedule' }}
      images: '[{"suffix":"","context":"image","dockerfile":"image/Dockerfile","smoke_test":".github/smoke-test.sh"}]'
      strict-image-pin: true
