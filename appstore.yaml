# App contract v2: one code-server with JDK 21 and Maven per person.
apiVersion: appstore/v2
name: java-ide
runtime: kubernetes
scope: user
scopeChoice: true
workload:
  containers:
    - name: ide
      # Built by .github/workflows/ci.yml. After changing image/, copy the new digest here.
      image: ghcr.io/dhbw-appstore-t3/apps/java-ide@sha256:b8fd52bc5438ac75af76870d2b62b3c559fc27446b55d27dbdc55b0a76147773
      expose: { port: 8080, path: / }
      # The Java language server needs far more than a plain code-server: allow bursts, reserve a moderate share.
      resources: { cpu: "2", memory: 3Gi, requests: { cpu: 200m, memory: 768Mi } }
      env:
        - { name: PASSWORD, from: generated-password }
      writablePaths: [/tmp]
  # HOME of the container: projects, ~/.m2 (Maven repository) and the language server's workspace data.
  storage: { size: 5Gi, mountPath: /home/coder }
# What the workspace may reach (the contract: app-registry README, "network"). Maven resolves plugins and dependencies
# from Maven Central, so a build fails without the internet: it starts on (a teacher can switch it off, an exam). The
# workspaces of one deployment may reach each other (students' own TCP/UDP servers and clients: the Java network
# exercises), so that starts on, too.
network:
  internet: { allowed: true, default: true }
  podNetwork: { allowed: true, default: true }
access:
  - { type: url, template: "https://{workload}-{deployment}.{domain}" }
  - { type: password, from: generated-password, username: "{user}" }
